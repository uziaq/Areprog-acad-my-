  competences: [D2.5]
  section: "S05-L01#ce-quest-un-condensateur"
  enonce: "On coupe l'alimentation d'une carte. Que devient la charge de ses condensateurs ?"
  propositions:
    - {id: a, texte: "Elle reste, et ne disparaît que lentement par les fuites ou par ce qui est relié à leurs bornes"}
    - {id: b, texte: "Elle disparaît instantanément"}
