  enonce: "Comment décharger un condensateur avant de le manipuler ?"
  propositions:
    - {id: a, texte: "À travers une résistance, puis vérifier au voltmètre"}
    - {id: b, texte: "Par un court-circuit franc avec un tournevis"}
    - {id: c, texte: "En attendant sans mesurer"}
    - {id: d, texte: "En le chauffant au fer"}
- id: S05-Q011
  type: choix_unique
  securite: true
  competences: [D2.5, D1.3]
  section: "S05-L01#décharger-en-sécurité"
