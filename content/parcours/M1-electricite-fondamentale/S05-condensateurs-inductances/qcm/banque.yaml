  enonce: "Un électrolytique est monté à l'envers et mis sous tension. Que risque-t-on ?"
  propositions:
    - {id: a, texte: "Un fort courant, de la chaleur, du gaz et l'ouverture de la soupape"}
    - {id: b, texte: "Rien, il fonctionne dans les deux sens"}
    - {id: c, texte: "Une simple baisse de capacité sans danger"}
    - {id: d, texte: "Il devient une résistance"}
- id: S05-Q010
