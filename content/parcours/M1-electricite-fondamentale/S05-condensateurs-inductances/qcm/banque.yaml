- id: S05-Q008
  type: choix_unique
  securite: false
  competences: [D2.5]
  section: "S05-L01#le-vieillissement-de-lélectrolytique"
  enonce: "Pourquoi un électrolytique placé près d'une source de chaleur vieillit-il plus vite ?"
  propositions:
    - {id: a, texte: "Sa durée de vie double environ pour chaque baisse de 10 °C, donc elle diminue quand la température monte"}
    - {id: b, texte: "La chaleur augmente sa capacité indéfiniment"}
    - {id: c, texte: "La chaleur n'a aucun effet"}
    - {id: d, texte: "Il se recharge tout seul"}
- id: S05-Q009
