# Chargé par l'application uniquement après la soumission du QCM.
- id: S05-Q001
  bonnes: [a]
  explication: "Le condensateur stocke l'énergie dans le champ électrique entre ses armatures ; c'est la bobine qui la stocke dans un champ magnétique."
  pourquoi_faux:
    b: "C'est le cas de la bobine."
    c: "La chaleur est une perte, pas un stockage."
    d: "Il en stocke : c'est son rôle."
  source: "S05-L01#ce-quest-un-condensateur"
- id: S05-Q002
  bonnes: [a]
  explication: "Un condensateur garde sa charge après la coupure et ne la perd que lentement par ses fuites internes."
  pourquoi_faux:
    b: "Il faut un chemin de décharge et du temps."
    c: "Seulement s'il existe un chemin de décharge vers la masse."
    d: "Rien ne crée de charge supplémentaire."
  source: "S05-L01#ce-quest-un-condensateur"
- id: S05-Q003
  valeur: 100
  tolerance_relative: 0.02
  unite: nF
  explication: "En parallèle, les capacités s'additionnent : 10 + 22 + 68 = 100 nF."
  source: "S05-L01#associer-des-condensateurs"
- id: S05-Q004
  valeur: 110
  tolerance_relative: 0.02
  unite: µF
  explication: "Deux capacités identiques en série : la moitié, 220 / 2 = 110 µF."
  source: "S05-L01#associer-des-condensateurs"
- id: S05-Q005
  bonnes: [a]
  explication: "En parallèle les capacités s'additionnent, en série elles diminuent : l'inverse des résistances."
  pourquoi_faux:
    b: "C'est l'inverse."
    c: "On associe couramment des condensateurs."
    d: "Les règles sont les mêmes pour toutes les technologies."
  source: "S05-L01#associer-des-condensateurs"
- id: S05-Q006
  valeur: 100
  tolerance_relative: 0.02
  unite: nF
  explication: "Un microfarad vaut mille nanofarads : 0,1 × 1 000 = 100 nF."
  source: "S05-L01#exemple-2--convertir"
- id: S05-Q007
  bonnes: [a]
  explication: "L'électrolytique aluminium est polarisé ; céramique et film ne le sont pas."
  pourquoi_faux:
    b: "La céramique est non polarisée."
    c: "Le film est non polarisé."
    d: "Les électrolytiques sont polarisés."
  source: "S05-L01#les-technologies"
- id: S05-Q008
  bonnes: [a]
  explication: "Selon la note du fabricant, la durée de vie double environ pour chaque baisse de 10 °C (loi d'Arrhenius) : la chaleur l'use plus vite."
  pourquoi_faux:
    b: "Ce n'est pas l'effet décrit."
    c: "La température est le premier facteur d'usure."
    d: "Aucun rapport."
  source: "S05-L01#le-vieillissement-de-lélectrolytique"
- id: S05-Q009
  bonnes: [a]
  explication: "En inverse, le courant augmente fortement, chauffe et produit du gaz : la soupape de sécurité peut s'ouvrir en peu de temps."
  pourquoi_faux:
    b: "Il est polarisé."
    c: "Le risque est thermique et mécanique."
    d: "Ce n'est pas le comportement décrit."
  source: "S05-L01#polarité-et-tension-nominale-de-lélectrolytique"
- id: S05-Q010
  bonnes: [a]
  explication: "On décharge à travers une résistance (le fabricant cité recommande 100 Ω à 1 kΩ) et la décharge se vérifie au voltmètre."
  pourquoi_faux:
    b: "Pointe de courant : risque pour le condensateur, l'outil et l'opérateur."
    c: "Une décharge ne se suppose pas."
    d: "Aucun rapport, et dangereux."
  source: "S05-L01#décharger-en-sécurité"
- id: S05-Q011
  bonnes: [a]
  explication: "Même déchargé, un électrolytique peut voir une tension réapparaître entre ses bornes : on mesure de nouveau avant de manipuler."
  pourquoi_faux:
    b: "Le voltmètre n'est pas en cause."
    c: "Le fabricant décrit justement ce phénomène."
    d: "La mesure ne recharge pas."
  source: "S05-L01#décharger-en-sécurité"
- id: S05-Q012
  valeur: 47
  tolerance_relative: 0.02
  unite: ms
  explication: "τ = 10 000 × 0,000 004 7 = 0,047 s, soit 47 ms."
  source: "S05-L02#la-constante-de-temps"
- id: S05-Q013
  valeur: 100
  tolerance_relative: 0.02
  unite: ms
  explication: "τ = 1 000 000 × 0,000 000 1 = 0,1 s, soit 100 ms."
  source: "S05-L02#la-constante-de-temps"
- id: S05-Q014
  valeur: 3.15
  tolerance_relative: 0.02
  unite: V
  explication: "Après 1τ, environ 63 % de la tension finale : 5 × 0,63 = 3,15 V."
  source: "S05-L02#la-règle-des-63-"
- id: S05-Q015
  valeur: 7.4
  tolerance_relative: 0.03
  unite: V
  explication: "En décharge, il reste environ 37 % après 1τ : 20 × 0,37 = 7,4 V."
  source: "S05-L02#la-règle-des-63-"
- id: S05-Q016
  bonnes: [a]
  explication: "Après 5τ, il a parcouru plus de 99 % du chemin : c'est la convention de calcul, sans valeur de garantie de sécurité."
  pourquoi_faux:
    b: "À 1τ, il n'est qu'à environ 63 %."
    c: "À 2τ, environ 86 %."
    d: "Mathématiquement oui, mais on retient 5τ en pratique."
  source: "S05-L02#la-règle-des-63-"
- id: S05-Q017
  valeur: 110
  tolerance_relative: 0.02
  unite: s
  explication: "τ = 100 000 × 0,000 22 = 22 s ; 5τ = 110 s."
  source: "S05-L02#exemple-4--calculer-τ"
- id: S05-Q018
  bonnes: [a]
  explication: "Le calcul donne un temps minimal ; seule la mesure confirme la décharge, car le chemin de décharge réel peut différer."
  pourquoi_faux:
    b: "Sans mesure, rien ne prouve la décharge."
    c: "Le calcul n'est pas une preuve."
    d: "Doubler le temps ne remplace pas la mesure."
  source: "S05-L02#lire-une-décharge-à-latelier"
- id: S05-Q019
  valeur: 2
  tolerance_relative: 0.02
  unite: ms
  explication: "τ = L / R = 0,05 / 25 = 0,002 s, soit 2 ms."
  source: "S05-L03#la-constante-de-temps-lr"
- id: S05-Q020
  valeur: 200
  tolerance_relative: 0.02
  unite: mA
  explication: "Le courant final vaut E / R = 12 / 60 = 0,2 A, soit 200 mA."
  source: "S05-L03#la-constante-de-temps-lr"
- id: S05-Q021
  bonnes: [a]
  explication: "La bobine s'oppose aux variations de courant ; le condensateur, aux variations de tension."
  pourquoi_faux:
    b: "C'est le condensateur."
    c: "En continu établi, seule sa résistance limite le courant."
    d: "Elle s'oppose aux variations de courant."
  source: "S05-L03#linductance"
- id: S05-Q022
  bonnes: [a]
  explication: "Le courant devrait passer à zéro en un temps très court : la bobine crée une tension de polarité inverse, très élevée."
  pourquoi_faux:
    b: "La source n'y est pour rien."
    c: "L'échauffement n'est pas la cause."
    d: "Le phénomène est décrit par les deux sources."
  source: "S05-L03#la-surtension-à-louverture"
- id: S05-Q023
  bonnes: [a]
  explication: "Elle est en parallèle sur la bobine, montée pour être bloquée en fonctionnement normal ; elle conduit à l'ouverture."
  pourquoi_faux:
    b: "En série, elle couperait ou laisserait passer le courant normal."
    c: "Elle doit être aux bornes de la bobine."
    d: "Elle bloquerait le courant de commande."
  source: "S05-L03#la-diode-de-roue-libre"
- id: S05-Q024
  bonnes: [a]
  explication: "La diode seule donne la décroissance la plus lente ; le fabricant de relais signale un effet défavorable sur l'ouverture des contacts. Une diode avec une Zener en série fait mieux."
  pourquoi_faux:
    b: "Elle la limite au contraire."
    c: "Le collage n'est pas affecté."
    d: "Le fabricant décrit justement une contrepartie."
  source: "S05-L03#la-diode-de-roue-libre"
- id: S05-Q025
  bonnes: [a]
  explication: "C'est un condensateur de découplage ; ses valeurs et son placement se lisent dans la fiche technique du circuit."
  pourquoi_faux:
    b: "Un condensateur ne mesure pas."
    c: "Ce n'est pas son rôle."
    d: "Une horloge utilise un quartz ou un oscillateur."
  source: "S05-L03#le-découplage--premier-aperçu"
