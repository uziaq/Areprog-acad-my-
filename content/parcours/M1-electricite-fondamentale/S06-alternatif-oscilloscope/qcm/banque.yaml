  propositions:
    - {id: a, texte: "L'oscilloscope balaie même sans déclenchement, ce qui aide à trouver le signal"}
    - {id: b, texte: "Il choisit seul tous les réglages"}
    - {id: c, texte: "Il n'affiche une trace que s'il y a déclenchement"}
    - {id: d, texte: "Il enregistre une seule acquisition"}
