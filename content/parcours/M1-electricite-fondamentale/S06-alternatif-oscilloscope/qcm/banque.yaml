  propositions:
    - {id: a, texte: "Le niveau de déclenchement est en dehors du signal, ou la source de déclenchement n'est pas la bonne voie"}
    - {id: b, texte: "Le calibre vertical est trop grand"}
    - {id: c, texte: "La sonde est en ×10"}
    - {id: d, texte: "Le couplage est en DC"}
