- id: S06-Q019
  type: choix_unique
  securite: false
  competences: [D3.3]
  section: "S06-L03#le-système-vertical"
  enonce: "Pourquoi observer un signal PWM en couplage DC plutôt qu'en AC ?"
  propositions:
    - {id: a, texte: "En AC, la composante continue est bloquée et le signal est recentré sur zéro, ce qui fausse la lecture des niveaux"}
    - {id: b, texte: "En AC, l'oscilloscope ne déclenche jamais"}
    - {id: c, texte: "En DC, le signal est filtré"}
    - {id: d, texte: "Il n'y a aucune différence"}
- id: S06-Q020
  type: choix_unique
  securite: false
  competences: [D3.3]
  section: "S06-L03#le-déclenchement"
