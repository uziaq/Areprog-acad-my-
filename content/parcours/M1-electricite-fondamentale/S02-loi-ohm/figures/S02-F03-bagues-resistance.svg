<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 170" width="360" height="170" fill="none" stroke="currentColor" stroke-width="2" font-family="Inter, system-ui, sans-serif" font-size="13">
  <!-- Figure réalisée par AREPROG : position des bagues d'une résistance à 4 bagues, sans couleur ni valeur. -->
  <path d="M20 80 H80" />
  <path d="M280 80 H340" />
  <rect x="80" y="55" width="200" height="50" rx="22" />
  <!-- bagues : trois groupées à gauche, la quatrième isolée à droite -->
  <rect x="104" y="55" width="12" height="50" fill="currentColor" fill-opacity="0.35" />
  <rect x="128" y="55" width="12" height="50" fill="currentColor" fill-opacity="0.35" />
  <rect x="152" y="55" width="12" height="50" fill="currentColor" fill-opacity="0.35" />
  <rect x="236" y="55" width="12" height="50" fill="currentColor" fill-opacity="0.35" />
  <text x="96" y="132" fill="currentColor" stroke="none">1</text>
  <text x="120" y="132" fill="currentColor" stroke="none">2</text>
  <text x="144" y="132" fill="currentColor" stroke="none">3</text>
  <text x="228" y="132" fill="currentColor" stroke="none">4</text>
  <text x="80" y="152" fill="currentColor" stroke="none" font-size="12">chiffre, chiffre, multiplicateur</text>
  <text x="214" y="152" fill="currentColor" stroke="none" font-size="12">tolérance</text>
  <text x="10" y="30" fill="currentColor" stroke="none" font-size="12">Lire depuis l'extrémité proche des bagues</text>
  <path d="M60 36 L104 54" />
</svg>
