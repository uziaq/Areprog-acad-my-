- id: S02-Q017
  type: choix_unique
  securite: true
  competences: [D2.2]
  section: "S02-L02#qui-chauffe-le-plus-"
  enonce: "Une résistance de 100 Ω et une de 1 kΩ sont en parallèle sous la même tension. Laquelle faut-il vérifier en priorité contre sa puissance nominale ?"
  propositions:
    - {id: a, texte: "Celle de 100 Ω : à tension égale, c'est elle qui dissipe le plus"}
    - {id: b, texte: "Celle de 1 kΩ : la plus grande résistance chauffe toujours le plus"}
    - {id: c, texte: "Aucune : en parallèle, la puissance se partage à égalité"}
    - {id: d, texte: "Aucune : seule la résistance équivalente compte"}
- id: S02-Q018
  type: choix_unique
  securite: true
  competences: [D2.2]
  section: "S02-L01#les-quatre-grandeurs"
