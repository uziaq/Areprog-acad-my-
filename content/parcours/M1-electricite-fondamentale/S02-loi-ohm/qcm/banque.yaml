  propositions:
    - {id: a, texte: "En série : alimentation coupée, j'ouvre le circuit et j'insère l'ampèremètre, cordon dans la borne de courant"}
    - {id: b, texte: "En parallèle aux bornes de la résistance, cordon dans la borne de courant"}
    - {id: c, texte: "En parallèle aux bornes de l'alimentation, sélecteur sur ampères"}
