- id: S02-Q007
  type: choix_unique
  securite: true
  competences: [D2.2]
  section: "S02-L01#la-puissance"
  enonce: "Le calcul montre qu'une résistance de puissance nominale 0,25 W devra dissiper 0,5 W. Que faites-vous ?"
  propositions:
    - {id: a, texte: "Je la garde : seule la valeur en ohms compte"}
    - {id: b, texte: "Je choisis une résistance de même valeur et de puissance nominale nettement supérieure à 0,5 W"}
