    - {id: d, texte: "Je double la tension pour compenser"}
- id: S02-Q008
  type: choix_multiple
  securite: false
  competences: [D2.2]
  section: "S02-L01#la-puissance"
  enonce: "Quelles expressions donnent la puissance dissipée par une résistance ? (plusieurs réponses)"
  propositions:
    - {id: a, texte: "P = U × I"}
    - {id: b, texte: "P = R × I²"}
    - {id: c, texte: "P = U² / R"}
    - {id: d, texte: "P = U / I"}
- id: S02-Q009
  type: choix_unique
  securite: true
  competences: [D2.2]
  section: "S02-L01#la-puissance"
  enonce: "Pendant un essai, une résistance devient très chaude et une odeur de brûlé apparaît. Quelle est la bonne réaction ?"
  propositions:
    - {id: a, texte: "Couper l'alimentation, laisser refroidir, puis recalculer la puissance dissipée"}
    - {id: b, texte: "Toucher la résistance pour estimer sa température"}
    - {id: c, texte: "Augmenter la tension pour terminer la mesure plus vite"}
    - {id: d, texte: "Continuer : une résistance supporte toujours la chaleur"}
- id: S02-Q010
  type: ordonnancement
  securite: false
  competences: [D2.2]
  section: "S02-L01#exemple-2--vérifier-la-puissance-dune-résistance"
  enonce: "Remettez dans l'ordre la démarche pour vérifier qu'une résistance convient."
  propositions:
    - {id: a, texte: "Calculer la puissance dissipée P = U² / R"}
    - {id: b, texte: "Relever la tension appliquée et la valeur de la résistance"}
    - {id: c, texte: "Comparer P à la puissance nominale de la résistance"}
    - {id: d, texte: "Conclure : la résistance convient ou doit être remplacée"}
