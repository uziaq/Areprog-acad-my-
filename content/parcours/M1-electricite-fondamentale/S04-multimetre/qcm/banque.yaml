- id: S04-Q001
  type: choix_unique
  securite: false
  competences: [D3.1]
  section: "S04-L01#ce-quil-y-a-dans-un-multimètre"
  enonce: "Au fond, quelle grandeur un multimètre numérique mesure-t-il toujours ?"
  propositions:
    - {id: a, texte: "Une tension"}
    - {id: b, texte: "Un courant"}
    - {id: c, texte: "Une résistance"}
    - {id: d, texte: "Une puissance"}
- id: S04-Q002
  type: choix_unique
  securite: false
  competences: [D3.1]
  section: "S04-L01#ce-quil-y-a-dans-un-multimètre"
  enonce: "Comment un multimètre mesure-t-il un courant ?"
  propositions:
    - {id: a, texte: "Il le fait passer dans un shunt interne et mesure la tension à ses bornes"}
    - {id: b, texte: "Il mesure le champ magnétique autour des cordons"}
    - {id: c, texte: "Il compte les électrons qui traversent le fusible"}
    - {id: d, texte: "Il mesure la résistance du circuit"}
- id: S04-Q003
  type: choix_unique
  securite: true
  competences: [D3.1, D1.2]
  section: "S04-L01#choisir-la-fonction-et-les-bornes"
  enonce: "Les cordons sont restés dans les bornes COM et A. Vous voulez mesurer la tension de la batterie. Que faites-vous ?"
  propositions:
    - {id: a, texte: "Je déplace le cordon rouge dans la borne VΩ et je règle la fonction V avant de toucher la batterie"}
    - {id: b, texte: "Je règle seulement le sélecteur sur V"}
    - {id: c, texte: "Je mesure directement : la borne A supporte la tension"}
    - {id: d, texte: "Je mesure rapidement pour limiter l'échauffement"}
- id: S04-Q004
  type: choix_unique
  securite: false
  competences: [D3.1]
  section: "S04-L01#choisir-la-fonction-et-les-bornes"
  enonce: "Comment se branche un voltmètre ?"
  propositions:
    - {id: a, texte: "En parallèle sur le point mesuré"}
    - {id: b, texte: "En série, circuit ouvert"}
    - {id: c, texte: "Entre la borne A et la masse"}
    - {id: d, texte: "Circuit hors tension uniquement"}
