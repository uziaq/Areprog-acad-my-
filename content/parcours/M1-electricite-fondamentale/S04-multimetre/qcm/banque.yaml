- id: S04-Q015
  type: choix_unique
  securite: false
  competences: [D3.7, D3.1]
  section: "S04-L02#choisir-le-calibre"
  enonce: "Pourquoi le plus petit calibre qui contient la valeur réduit-il l'incertitude ?"
  propositions:
    - {id: a, texte: "Sa résolution est plus fine, donc la partie fixe (n points) est plus petite"}
    - {id: b, texte: "La partie en % y est nulle"}
    - {id: c, texte: "Le multimètre chauffe moins"}
    - {id: d, texte: "Il ne la réduit pas"}
- id: S04-Q016
  type: choix_unique
  securite: false
  competences: [D3.7, D3.1]
  section: "S04-L02#exemple-5--le-calibre-change-tout"
  enonce: "On lit 0,150 V. Précision ±(0,5 % + 2). Calibre 2 V (résolution 0,001 V) ou 20 V (résolution 0,01 V) : lequel donne la plus petite incertitude ?"
  propositions:
    - {id: a, texte: "2 V : environ 0,003 V contre 0,021 V"}
    - {id: b, texte: "20 V : la pleine échelle est plus grande"}
    - {id: c, texte: "Les deux donnent la même incertitude"}
    - {id: d, texte: "On ne peut pas savoir sans la notice"}
- id: S04-Q017
  type: choix_unique
  securite: false
  competences: [D3.7]
  section: "S04-L02#conformité--tolérance-et-incertitude-ensemble"
  enonce: "Une résistance de 100 Ω ±5 % est lue 104,0 Ω avec une incertitude de 0,9 Ω. Quelle est la conclusion ?"
  propositions:
    - {id: a, texte: "Conforme : l'intervalle 103,1 à 104,9 Ω est entièrement dans 95 à 105 Ω"}
    - {id: b, texte: "Non conforme : la lecture dépasse 100 Ω"}
    - {id: c, texte: "Non concluant"}
    - {id: d, texte: "Impossible à dire sans l'incertitude du fabricant"}
- id: S04-Q018
  type: choix_unique
  securite: false
  competences: [D3.7]
  section: "S04-L02#exemple-6--un-résultat-non-concluant"
  enonce: "L'intervalle de mesure est à cheval sur une borne de la tolérance. Que faut-il écrire au journal ?"
  propositions:
    - {id: a, texte: "Non concluant, avec la mesure et son incertitude ; prévoir un instrument plus précis ou une autre méthode"}
    - {id: b, texte: "Conforme, puisqu'une partie est dedans"}
    - {id: c, texte: "Non conforme, puisqu'une partie est dehors"}
    - {id: d, texte: "Rien, la mesure est ratée"}
