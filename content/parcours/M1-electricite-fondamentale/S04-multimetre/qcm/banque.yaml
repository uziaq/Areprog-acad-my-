- id: S04-Q024
  type: choix_unique
  securite: true
  competences: [D3.1, D1.2]
  section: "S04-L03#ne-pas-détruire-le-fusible"
  enonce: "Vous ignorez l'ordre de grandeur du courant à mesurer. Comment commencez-vous ?"
  propositions:
    - {id: a, texte: "Je l'estime par la loi d'Ohm ; s'il reste un doute, borne et calibre A les plus élevés"}
    - {id: b, texte: "Je commence par la borne mA, plus précise"}
    - {id: c, texte: "Je mesure d'abord en parallèle pour voir"}
    - {id: d, texte: "Je retire le fusible pour ne pas le griller"}
- id: S04-Q025
  type: choix_unique
  securite: true
  competences: [D3.1, D1.2]
  section: "S04-L03#ne-pas-détruire-le-fusible"
  enonce: "Le fusible de la borne A a grillé. Par quoi le remplacer ?"
  propositions:
    - {id: a, texte: "Uniquement par le modèle prescrit par le fabricant du multimètre"}
    - {id: b, texte: "Par un fusible de même calibre en ampères, quel qu'il soit"}
    - {id: c, texte: "Par un fusible de calibre plus élevé pour qu'il tienne"}
    - {id: d, texte: "Par un fil de cuivre en attendant"}
