  enonce: "Un diviseur de tension à deux résistances peut-il fournir en sortie une tension plus élevée que son entrée ?"
  propositions:
    - {id: a, texte: "Non : le rapport R2 / (R1 + R2) est toujours inférieur à 1"}
    - {id: b, texte: "Oui, si R2 est plus grande que R1"}
