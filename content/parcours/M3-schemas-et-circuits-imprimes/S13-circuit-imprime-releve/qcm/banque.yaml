- id: S13-Q011
  type: choix_unique
  securite: true
  competences: [D5.3]
  section: "S13-L02#préparer-la-carte"
  enonce: "Dans quel état doit être la carte avant de suivre une piste au multimètre ?"
  propositions:
    - {id: a, texte: "Hors tension, condensateurs déchargés, sur le poste ESD"}
    - {id: b, texte: "Sous tension, pour voir les signaux"}
    - {id: c, texte: "Sous tension, avec une limite de courant"}
    - {id: d, texte: "Peu importe en continuité"}
- id: S13-Q012
  type: choix_unique
  securite: true
  competences: [D5.3]
  section: "S13-L02#préparer-la-carte"
  enonce: "Avant de manipuler une carte de récupération, que mesurez-vous sur ses condensateurs électrolytiques ?"
  propositions:
    - {id: a, texte: "Leur tension, et je les décharge à travers une résistance si elle n'est pas négligeable"}
    - {id: b, texte: "Leur capacité, carte sous tension"}
    - {id: c, texte: "Rien, une carte débranchée est toujours déchargée"}
    - {id: d, texte: "Leur résistance en court-circuitant leurs bornes avec un tournevis"}
- id: S13-Q013
  type: choix_unique
  securite: true
  competences: [D5.3]
  section: "S13-L02#préparer-la-carte"
  enonce: "Pourquoi manipuler la carte de récupération sur le poste ESD, alors qu'elle est hors service ?"
