# Chargé par l'application uniquement après la soumission du QCM.
- id: S13-Q001
  bonnes: [a]
  explication: "Le substrat donne rigidité et épaisseur ; il existe aussi des circuits souples."
  pourquoi_faux:
    b: "Le cuivre forme les couches conductrices."
    c: "Sans rapport ici."
    d: "Le vernis recouvre le cuivre."
  source: "S13-L01#un-empilement-de-couches"
- id: S13-Q002
  bonnes: [a]
  explication: "Le nombre de couches compte les couches de cuivre ; on va d'une couche à seize ou plus."
  pourquoi_faux:
    b: "On compte le cuivre."
    c: "Sans rapport."
    d: "Sans rapport."
  source: "S13-L01#un-empilement-de-couches"
- id: S13-Q003
  bonnes: [a]
  explication: "La sérigraphie est imprimée sur le vernis pour l'assemblage et le repérage."
  pourquoi_faux:
    b: "Le vernis isole les pistes."
    c: "Invisible et sans texte."
    d: "Sans rapport."
  source: "S13-L01#un-empilement-de-couches"
- id: S13-Q004
  bonnes: [a]
  explication: "Il est défini par ses bords plutôt que par un chemin."
  pourquoi_faux:
    b: "C'est une piste."
    c: "C'est un via ou un trou métallisé."
    d: "C'est un point de test."
  source: "S13-L01#le-vocabulaire-de-la-carte"
- id: S13-Q005
  bonnes: [a]
  explication: "Sans thermique, la pastille chauffe mal et la soudure est difficile : elle demande plus de chaleur au dessoudage."
  pourquoi_faux:
    b: "Sans rapport."
    c: "Elle relie la pastille au plan."
    d: "Ce n'est pas son rôle."
  source: "S13-L01#le-vocabulaire-de-la-carte"
- id: S13-Q006
  bonnes: [a]
  explication: "Un via enterré reste à l'intérieur : on ne peut suivre sa liaison que par continuité."
  pourquoi_faux:
    b: "Il se voit des deux côtés."
    c: "Le microvia part d'une couche externe."
    d: "Sans rapport."
  source: "S13-L01#les-types-de-vias"
- id: S13-Q007
  bonnes: [a]
  explication: "Le via borgne ou enterré peut, lui, être placé entre des couches quelconques."
  pourquoi_faux:
    b: "C'est le via traversant."
    c: "C'est le via borgne ou enterré."
    d: "Sans rapport."
  source: "S13-L01#les-types-de-vias"
