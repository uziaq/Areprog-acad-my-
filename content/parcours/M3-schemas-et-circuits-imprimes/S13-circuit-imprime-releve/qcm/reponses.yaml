- id: S13-Q011
  bonnes: [a]
  explication: "Une résistance et une continuité se mesurent circuit hors tension ; un condensateur chargé fausse la mesure et peut abîmer l'instrument (FE-06)."
  pourquoi_faux:
    b: "L'ohmmètre ne se pose jamais sur un circuit alimenté."
    c: "Même limitée, la tension fausse la mesure."
    d: "La continuité est une mesure de résistance."
  source: "S13-L02#préparer-la-carte"
- id: S13-Q012
  bonnes: [a]
  explication: "Un condensateur peut garder sa charge après débranchement ; ne pas le vérifier est la faute éliminatoire FE-06."
  pourquoi_faux:
    b: "La carte n'est jamais alimentée."
    c: "Un condensateur peut rester chargé."
    d: "Le court-circuit franc est à proscrire ; on décharge à travers une résistance."
  source: "S13-L02#préparer-la-carte"
- id: S13-Q013
  bonnes: [a]
  explication: "Une carte de récupération sert aussi aux relevés et aux essais ; la manipuler sans bracelet est la faute FE-01."
  pourquoi_faux:
    b: "Le poste ESD protège les composants, pas l'opérateur contre un choc."
    c: "La règle s'applique à toute carte."
    d: "Sans rapport."
  source: "S13-L02#préparer-la-carte"
- id: S13-Q014
  bonnes: [a]
  explication: "Ces repères traversent la carte et se voient au même endroit des deux côtés, une fois l'image arrière retournée."
  pourquoi_faux:
    b: "Elle n'est présente que d'un côté à la fois."
    c: "Sans rapport."
    d: "Un CMS n'est que d'un côté."
  source: "S13-L02#superposer-le-recto-et-le-verso"
- id: S13-Q015
  bonnes: [a]
  explication: "Un logiciel de conception propose de même une vue retournée de la carte."
  pourquoi_faux:
    b: "Sans rapport."
    c: "Sans rapport."
    d: "Sans retournement, les repères ne coïncident pas."
  source: "S13-L02#superposer-le-recto-et-le-verso"
- id: S13-Q016
  bonnes: [a]
  explication: "On tranche en ohmmètre : une piste fait une fraction d'ohm."
  pourquoi_faux:
    b: "Il peut sonner à travers un composant de faible résistance."
    c: "C'est un test de résistance."
    d: "Sans rapport."
  source: "S13-L02#confirmer-au-multimètre"
- id: S13-Q017
  bonnes: [a]
  explication: "Les cordons ajoutent leur propre résistance aux faibles valeurs."
  pourquoi_faux:
    b: "Ils ont une résistance propre."
    c: "Sans rapport."
    d: "Dangereux et sans intérêt."
  source: "S13-L02#confirmer-au-multimètre"
- id: S13-Q018
  bonnes: [a]
  explication: "On élimine d'abord une erreur de mesure, puis on cherche coupure, corrosion ou fissure."
  pourquoi_faux:
    b: "La mesure peut être en cause."
    c: "Le vernis protège la piste."
    d: "On ne mesure pas une résistance sous tension."
  source: "S13-L02#exemple-6--la-piste-coupée"
- id: S13-Q019
  bonnes: [a]
  explication: "Le relevé est partiel et honnête ; il n'est jamais présenté comme un schéma constructeur."
  pourquoi_faux:
    b: "Il n'en est pas un."
    c: "Il reste partiel."
    d: "Il est utile s'il est vérifiable."
  source: "S13-L03#pourquoi-relever-un-schéma"
- id: S13-Q020
  bonnes: [a]
  explication: "Les photos servent de carte pour tout le relevé et gardent l'état initial."
  pourquoi_faux:
    b: "On dessine au fur et à mesure des liaisons confirmées."
    c: "Inutile et destructif."
    d: "La carte reste hors tension."
  source: "S13-L03#la-méthode-de-relevé"
- id: S13-Q021
  bonnes: [a]
  explication: "On n'écrit jamais une valeur plausible à la place d'une valeur confirmée."
  pourquoi_faux:
    b: "Valeur supposée : interdit."
    c: "Le composant existe, il doit figurer."
    d: "Rien ne dit qu'ils sont égaux."
  source: "S13-L03#la-méthode-de-relevé"
- id: S13-Q022
  bonnes: [a]
  explication: "Un élément sans ligne de journal est [À VÉRIFIER]."
  pourquoi_faux:
    b: "Sans rapport."
    c: "Il accompagne le schéma."
    d: "Sans rapport."
  source: "S13-L03#le-journal-de-relevé"
- id: S13-Q023
  bonnes: [a]
  explication: "Le lecteur doit voir exactement quel élément n'est pas confirmé."
  pourquoi_faux:
    b: "Trop vague."
    c: "Le schéma doit être honnête."
    d: "On n'écrit pas sur la carte."
  source: "S13-L03#dessiner-dans-un-logiciel-de-schéma"
- id: S13-Q024
  bonnes: [a]
  explication: "Un marquage CMS court ne suffit pas à identifier un composant ; on cherche ensuite une table de marquages et sa fiche."
  pourquoi_faux:
    b: "Supposition non confirmée."
    c: "Le relevé serait faux."
    d: "Inutile à ce stade et risqué pour la carte."
  source: "S13-L03#exemple-8--un-composant-non-identifié"
- id: S13-Q025
  bonnes: [a]
  explication: "Les points de test sont prévus pour une pointe ou un contact à ressort."
  pourquoi_faux:
    b: "Elle peut être reliée à n'importe quel réseau."
    c: "Sans rapport."
    d: "Sans rapport."
  source: "S13-L02#les-points-de-test"
