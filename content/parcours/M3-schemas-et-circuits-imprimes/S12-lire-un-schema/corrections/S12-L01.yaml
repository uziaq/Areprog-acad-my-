# Chargé par l'application uniquement après la réponse de l'apprenant.
- id: S12-L01-EX01
  bonnes: [a]
  explication: "Préfixe Q : un transistor. La flèche est sur l'émetteur ; entrante, c'est un PNP (« NPN : not pointing in »)."
  renvoi_section: "S12-L01#les-symboles-et-leurs-variantes"
- id: S12-L01-EX02
  bonnes: [a]
  explication: "La plaque courbe et le signe plus signalent un condensateur polarisé ; la plaque courbe est en général la cathode. Monté à l'envers, il peut être détruit (S05)."
  renvoi_section: "S12-L01#les-symboles-et-leurs-variantes"
- id: S12-L01-EX03
  valeur: 2.2
  tolerance_relative: 0.02
  unite: kΩ
  explication: "La lettre K remplace la virgule et indique les kilo-ohms : 2K2 vaut 2,2 kΩ. R14 est la référence, unique sur le schéma."
  renvoi_section: "S12-L01#référence-et-valeur"
