- id: S26-L03-EX02
  version: "0.1"
  type: choix_unique
  enonce: "Un composant chip a une épaisseur de 0,8 mm. Quelle hauteur minimale de ménisque la norme NASA demande-t-elle ?"
  propositions:
    - {id: a, texte: "0,4 mm, soit 50 % de l'épaisseur"}
    - {id: b, texte: "0,8 mm, toute l'épaisseur"}
    - {id: c, texte: "0,2 mm, soit 25 % de l'épaisseur"}
    - {id: d, texte: "Aucune hauteur minimale"}
  competences: [D9.5]
  objectif: O2
- id: S26-L03-EX03
