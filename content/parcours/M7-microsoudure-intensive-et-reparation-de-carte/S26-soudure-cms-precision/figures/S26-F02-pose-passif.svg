  <text x="65" y="160" fill="currentColor" stroke="none" text-anchor="middle" font-size="11">1 étamer une</text><text x="65" y="174" fill="currentColor" stroke="none" text-anchor="middle" font-size="11">seule pastille</text>
  <text x="205" y="160" fill="currentColor" stroke="none" text-anchor="middle" font-size="11">2 fixer à la pince</text><text x="205" y="174" fill="currentColor" stroke="none" text-anchor="middle" font-size="11">en refondant</text>
  <text x="345" y="160" fill="currentColor" stroke="none" text-anchor="middle" font-size="11">3 souder la</text><text x="345" y="174" fill="currentColor" stroke="none" text-anchor="middle" font-size="11">deuxième extrémité</text>
  <text x="485" y="160" fill="currentColor" stroke="none" text-anchor="middle" font-size="11">4 reprendre si</text><text x="485" y="174" fill="currentColor" stroke="none" text-anchor="middle" font-size="11">besoin, avec flux</text>
  <text x="300" y="214" fill="currentColor" stroke="none" text-anchor="middle" font-size="11">la panne touche la pastille et la terminaison, jamais le corps céramique</text>
