  <rect x="312" y="98" width="66" height="24" rx="2" /><ellipse cx="312" cy="110" rx="9" ry="14" fill="currentColor" fill-opacity="0.3" stroke="none" /><ellipse cx="378" cy="110" rx="9" ry="14" fill="currentColor" fill-opacity="0.3" stroke="none" />
