<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" fill="none" stroke="currentColor" stroke-width="2" font-family="Inter, system-ui, sans-serif" font-size="12">
  <!-- Figure réalisée par AREPROG : défauts de soudure d'un composant chip, d'après les critères de NASA-STD-8739.2 et de la note Johanson ; dessin de principe. -->
  <g stroke-width="1.5">
    <path d="M20 120 H180 M220 120 H380 M420 120 H580" stroke-dasharray="4 4" stroke-width="1" />
    <rect x="35" y="114" width="40" height="6" /><rect x="125" y="114" width="40" height="6" />
    <rect x="235" y="114" width="40" height="6" /><rect x="325" y="114" width="40" height="6" />
    <rect x="435" y="114" width="40" height="6" /><rect x="525" y="114" width="40" height="6" />
    <rect x="60" y="90" width="80" height="24" rx="2" />
    <rect x="260" y="90" width="80" height="24" rx="2" />
    <rect x="460" y="90" width="80" height="24" rx="2" />
  </g>
  <path d="M40 114 Q55 112 60 96 V114 Z M160 114 Q145 112 140 96 V114 Z" fill="currentColor" fill-opacity="0.3" stroke="none" />
  <path d="M245 114 Q255 113 260 110 V114 Z M355 114 Q345 113 340 110 V114 Z" fill="currentColor" fill-opacity="0.3" stroke="none" />
  <path d="M440 114 C440 70 470 70 480 86 L480 114 Z M560 114 C560 70 530 70 520 86 L520 114 Z" fill="currentColor" fill-opacity="0.3" stroke="none" />
  <text x="100" y="150" fill="currentColor" stroke="none" text-anchor="middle" font-size="11" font-weight="600">correct</text><text x="100" y="166" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">ménisque concave</text>
  <text x="300" y="150" fill="currentColor" stroke="none" text-anchor="middle" font-size="11" font-weight="600">manque</text><text x="300" y="166" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">ménisque sous 50 % de l'épaisseur</text>
  <text x="500" y="150" fill="currentColor" stroke="none" text-anchor="middle" font-size="11" font-weight="600">excès</text><text x="500" y="166" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">soudure bombée sur le corps</text>
  <g stroke-width="1.5">
    <path d="M20 280 H180" stroke-dasharray="4 4" stroke-width="1" />
    <rect x="35" y="274" width="40" height="6" /><rect x="125" y="274" width="40" height="6" />
    <rect x="70" y="200" width="24" height="74" rx="2" />
    <rect x="235" y="215" width="40" height="40" /><rect x="325" y="215" width="40" height="40" />
    <rect x="262" y="226" width="80" height="24" rx="2" transform="translate(0 14)" />
    <rect x="435" y="215" width="40" height="40" /><rect x="525" y="215" width="40" height="40" />
  </g>
  <path d="M40 274 Q60 272 70 262 V274 Z" fill="currentColor" fill-opacity="0.3" stroke="none" />
  <path d="M470 228 H530 V242 H470 Z" fill="currentColor" fill-opacity="0.35" stroke="none" />
  <text x="100" y="304" fill="currentColor" stroke="none" text-anchor="middle" font-size="11" font-weight="600">pierre tombale</text><text x="100" y="320" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">vue de profil</text>
  <text x="300" y="304" fill="currentColor" stroke="none" text-anchor="middle" font-size="11" font-weight="600">décalé</text><text x="300" y="320" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">débord latéral, vue de dessus</text>
  <text x="500" y="304" fill="currentColor" stroke="none" text-anchor="middle" font-size="11" font-weight="600">pont</text><text x="500" y="320" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">deux pastilles reliées, vue de dessus</text>
  <text x="300" y="30" fill="currentColor" stroke="none" text-anchor="middle" font-size="11">en haut : vues de profil ; seule la soudure « correct » est acceptée</text>
</svg>
