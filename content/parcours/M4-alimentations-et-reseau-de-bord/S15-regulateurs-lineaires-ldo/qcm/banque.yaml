    - {id: a, texte: "Avec le thermomètre à contact ou la sonde, sans toucher le boîtier avec les doigts"}
    - {id: b, texte: "En posant le doigt sur la languette"}
    - {id: c, texte: "En approchant la joue"}
    - {id: d, texte: "En coupant l'alimentation et en touchant aussitôt"}
- id: S15-Q024
  type: choix_unique
  securite: true
  competences: [D6.1]
  section: "S15-L03#méthode-de-diagnostic"
  enonce: "Vous montez le condensateur électrolytique de sortie du régulateur sur la carte d'entraînement. Que vérifiez-vous avant la mise sous tension ?"
  propositions:
    - {id: a, texte: "Sa polarité : le plus vers la sortie du régulateur, le moins vers la masse"}
    - {id: b, texte: "Rien, un condensateur n'a pas de sens"}
    - {id: c, texte: "Seulement sa couleur"}
