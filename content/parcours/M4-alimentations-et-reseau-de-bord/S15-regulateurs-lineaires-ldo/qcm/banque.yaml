    - {id: a, texte: "Au démarrage du moteur, la tension batterie peut descendre vers 6 V"}
    - {id: b, texte: "La batterie dépasse toujours 15 V"}
    - {id: c, texte: "Elle fixe la fréquence de l'alternateur"}
    - {id: d, texte: "Elle n'a aucune importance sur un véhicule"}
- id: S15-Q012
  type: choix_unique
  securite: false
  competences: [D6.1]
  section: "S15-L02#le-courant-de-repos"
  enonce: "Comment se définit le courant de repos d'un régulateur ?"
  propositions:
    - {id: a, texte: "Courant d'entrée moins courant de sortie"}
    - {id: b, texte: "Courant de sortie à pleine charge"}
    - {id: c, texte: "Courant de court-circuit"}
    - {id: d, texte: "Courant dans le condensateur de sortie"}
- id: S15-Q013
  type: choix_unique
  securite: false
  competences: [D6.1]
  section: "S15-L02#le-courant-de-repos"
  enonce: "Pourquoi un faible courant de repos compte-t-il pour un régulateur toujours alimenté sur un véhicule ?"
  propositions:
    - {id: a, texte: "Il décharge la batterie quand le véhicule est à l'arrêt"}
    - {id: b, texte: "Il augmente la tension de sortie"}
    - {id: c, texte: "Il améliore la stabilité"}
    - {id: d, texte: "Il réduit la tension de déchet"}
