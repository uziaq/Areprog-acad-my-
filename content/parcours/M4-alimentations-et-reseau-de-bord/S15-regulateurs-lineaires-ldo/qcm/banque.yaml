- id: S15-Q019
  type: choix_unique
  securite: false
  competences: [D6.1]
  section: "S15-L03#linversion-de-polarité"
  enonce: "Un LDO à un seul MOSFET de passage est-il protégé contre l'inversion de polarité ?"
  propositions:
    - {id: a, texte: "Non : le courant inverse passe par la diode interne du transistor ; il faut une diode série"}
    - {id: b, texte: "Oui, toujours"}
    - {id: c, texte: "Oui, grâce à l'arrêt thermique"}
    - {id: d, texte: "Oui, grâce à l'enable"}
