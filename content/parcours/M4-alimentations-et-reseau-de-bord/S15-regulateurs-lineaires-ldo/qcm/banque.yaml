  enonce: "Un régulateur a son entrée correcte mais aucune sortie, et il est froid. Que mesurez-vous avant de le condamner ?"
  propositions:
    - {id: a, texte: "Son enable, puis sa masse"}
    - {id: b, texte: "Rien, il est en panne"}
    - {id: c, texte: "La température de la charge"}
    - {id: d, texte: "La fréquence de l'alternateur"}
- id: S15-Q021
  type: choix_unique
  securite: false
  competences: [D6.1]
  section: "S15-L03#enable-reset-et-power-good"
  enonce: "À quoi sert le délai de reset (ou power-good) d'un LDO qui alimente un microcontrôleur ?"
  propositions:
    - {id: a, texte: "À laisser l'oscillateur du microcontrôleur se stabiliser avant de libérer le reset"}
    - {id: b, texte: "À augmenter la tension de sortie"}
    - {id: c, texte: "À couper la sortie en cas de surchauffe"}
    - {id: d, texte: "À limiter le courant"}
