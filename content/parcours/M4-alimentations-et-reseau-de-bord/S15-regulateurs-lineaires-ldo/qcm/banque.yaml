  enonce: "Après avoir isolé la charge d'un régulateur suspect, comment remettez-vous la carte sous tension ?"
  propositions:
    - {id: a, texte: "Avec une alimentation de laboratoire limitée en courant, limite écrite avant la mise sous tension"}
    - {id: b, texte: "Sur une batterie, sans limite"}
    - {id: c, texte: "Sur une alimentation réglée au maximum de courant"}
