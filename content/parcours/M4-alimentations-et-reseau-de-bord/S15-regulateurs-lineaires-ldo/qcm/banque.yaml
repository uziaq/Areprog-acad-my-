# Questions sans les bonnes réponses (voir reponses.yaml).
# Banque de 25 questions (pédagogie v0.3 ; décision E-01 encore ouverte). Valeurs de calcul [EXEMPLE].
- id: S15-Q001
  type: choix_unique
  securite: false
  competences: [D6.1]
  section: "S15-L01#le-principe"
  enonce: "Comment un régulateur linéaire maintient-il sa tension de sortie ?"
  propositions:
    - {id: a, texte: "En réglant en permanence son élément de passage, comme une résistance variable, d'après une contre-réaction"}
    - {id: b, texte: "En découpant la tension à haute fréquence"}
    - {id: c, texte: "En stockant l'énergie dans une inductance"}
    - {id: d, texte: "En coupant la sortie quand elle est trop haute"}
