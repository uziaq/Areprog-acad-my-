- id: S16-Q001
  type: choix_unique
  securite: false
  competences: [D6.2]
  section: "S16-L01#pourquoi-découper"
  enonce: "Pourquoi un convertisseur à découpage perd-il beaucoup moins d'énergie qu'un régulateur linéaire ?"
  propositions:
    - {id: a, texte: "Son transistor commute en tout ou rien et le résultat est lissé par une inductance et un condensateur"}
    - {id: b, texte: "Il dissipe l'écart entre entrée et sortie dans un dissipateur plus grand"}
    - {id: c, texte: "Il n'a pas de transistor"}
    - {id: d, texte: "Il fonctionne sans boucle de régulation"}
