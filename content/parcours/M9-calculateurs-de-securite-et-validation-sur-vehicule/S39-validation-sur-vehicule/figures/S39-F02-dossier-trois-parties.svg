  <text x="95.0" y="156.0" text-anchor="middle" fill="currentColor" stroke="none" font-size="10.5">mesures, captures,</text>
  <text x="95.0" y="171.0" text-anchor="middle" fill="currentColor" stroke="none" font-size="10.5">comparées à la référence</text>
