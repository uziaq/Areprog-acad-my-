- id: S01-Q008
  type: choix_unique
  securite: true
  competences: [D1.2]
  section: "S01-L02#le-piège-des-bornes-de-courant"
  enonce: "Les cordons sont restés dans la borne de courant, le sélecteur est sur volts, et vous posez les pointes aux bornes d'une batterie. Que se passe-t-il ?"
  propositions:
    - {id: a, texte: "Le multimètre affiche la tension : seul le sélecteur compte"}
    - {id: b, texte: "Le multimètre affiche zéro, sans conséquence"}
    - {id: c, texte: "Le multimètre se comporte comme un court-circuit aux bornes de la batterie"}
    - {id: d, texte: "Le multimètre mesure automatiquement le courant de la batterie"}
- id: S01-Q009
  type: choix_unique
  securite: true
  competences: [D1.2]
  section: "S01-L02#les-catégories-de-mesure"
  enonce: "Quelle catégorie et quelle tension doivent avoir les cordons de mesure d'un multimètre CAT III 600 V ?"
  propositions:
    - {id: a, texte: "N'importe lesquelles : seule la catégorie du multimètre compte"}
    - {id: b, texte: "Au moins CAT III 600 V"}
    - {id: c, texte: "CAT I suffit, car les cordons ne contiennent pas d'électronique"}
    - {id: d, texte: "Une catégorie plus basse, pour compenser la longueur des cordons"}
