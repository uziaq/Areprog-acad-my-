- id: S01-Q001
  type: choix_unique
  securite: false
  competences: [D1.1]
  section: "S01-L01#comment-naît-une-charge-électrostatique"
  enonce: "Comment naît une charge électrostatique par frottement ?"
  propositions:
    - {id: a, texte: "Deux matériaux en contact échangent des électrons, puis gardent cette charge en se séparant"}
    - {id: b, texte: "Un courant venu du secteur s'accumule dans les matériaux isolants"}
    - {id: c, texte: "La chaleur du frottement crée des électrons supplémentaires"}
    - {id: d, texte: "Elle ne naît que par temps humide"}
- id: S01-Q002
  type: choix_unique
  securite: false
  competences: [D1.1]
  section: "S01-L01#comment-une-décharge-endommage-un-composant"
  enonce: "Qu'appelle-t-on une défaillance latente après une décharge électrostatique ?"
  propositions:
    - {id: a, texte: "Un composant détruit qui ne fonctionne plus du tout au premier essai"}
    - {id: b, texte: "Un composant affaibli qui fonctionne encore, puis tombe en panne après une période de fonctionnement normal"}
    - {id: c, texte: "Une décharge qui n'a laissé aucune trace et aucune conséquence"}
    - {id: d, texte: "Une panne due à l'humidité de l'atelier"}
