- id: S01-Q013
  type: choix_unique
  securite: true
  competences: [D1.3]
  section: "S01-L02#exemple-4--choisir-une-limite-de-courant"
  enonce: "À la mise sous tension d'une carte d'essai, l'alimentation passe immédiatement en courant constant. Que faites-vous ?"
  propositions:
    - {id: a, texte: "J'augmente la limite jusqu'à ce que l'alimentation repasse en tension constante"}
    - {id: b, texte: "Je coupe la sortie et je cherche pourquoi la carte consomme plus que prévu"}
    - {id: c, texte: "Je retire la limitation pour voir le vrai courant"}
    - {id: d, texte: "J'attends que la carte chauffe pour repérer le composant fautif au toucher"}
- id: S01-Q014
  type: choix_unique
  securite: true
  competences: [D1.3]
  section: "S01-L02#lalimentation-de-laboratoire--tension-constante-et-courant-constant"
  enonce: "Quand réglez-vous la limite de courant d'une alimentation de TP ?"
  propositions:
    - {id: a, texte: "Avant de brancher la carte, et je l'écris au journal"}
    - {id: b, texte: "Après la mise sous tension, si quelque chose chauffe"}
    - {id: c, texte: "Jamais : la limite fausse les mesures"}
    - {id: d, texte: "Seulement pour les calculateurs réels, à partir de S18"}
