<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" width="360" height="230" fill="none" stroke="currentColor" stroke-width="2" font-family="Inter, system-ui, sans-serif" font-size="13">
  <!-- Figure réalisée par AREPROG : principe d'un poste ESD, sans valeur ni marque. -->
  <!-- établi et tapis dissipatif -->
  <rect x="20" y="70" width="230" height="16" />
  <text x="30" y="62" fill="currentColor" stroke="none">Tapis dissipatif sur l'établi</text>
  <!-- carte posée -->
  <rect x="150" y="56" width="60" height="14" stroke-dasharray="4 3" />
  <text x="152" y="50" fill="currentColor" stroke="none" font-size="12">Carte</text>
  <!-- bracelet -->
  <circle cx="60" cy="140" r="14" />
  <text x="20" y="172" fill="currentColor" stroke="none">Bracelet au poignet</text>
  <path d="M74 140 H140 V190" />
  <!-- liaison tapis -->
  <path d="M240 86 V190" />
  <!-- point de terre commun -->
  <circle cx="190" cy="190" r="6" fill="currentColor" stroke="none" />
  <path d="M140 190 H240" />
  <text x="150" y="212" fill="currentColor" stroke="none">Point de terre commun</text>
  <path d="M240 190 H300 V160" />
  <!-- symbole de terre -->
  <line x1="285" y1="160" x2="315" y2="160" />
  <line x1="290" y1="152" x2="310" y2="152" />
  <line x1="295" y1="144" x2="305" y2="144" />
  <path d="M300 144 V120" />
  <text x="262" y="112" fill="currentColor" stroke="none">Terre de l'atelier</text>
</svg>
