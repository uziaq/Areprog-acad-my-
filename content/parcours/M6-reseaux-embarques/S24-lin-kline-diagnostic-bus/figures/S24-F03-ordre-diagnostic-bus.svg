  <text x="300" y="32" fill="currentColor" stroke="none" text-anchor="middle" font-weight="600">1 symptôme et schéma officiel</text>
  <text x="300" y="48" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">alimentation et masse des nœuds concernés</text>
  <text x="300" y="112" fill="currentColor" stroke="none" text-anchor="middle" font-weight="600">2 hors tension : résistances</text>
