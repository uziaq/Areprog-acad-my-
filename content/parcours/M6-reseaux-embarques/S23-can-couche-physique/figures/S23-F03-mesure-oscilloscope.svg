<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" fill="none" stroke="currentColor" stroke-width="2" font-family="Inter, system-ui, sans-serif" font-size="12">
  <!-- Figure réalisée par AREPROG : mesure d'un bus CAN à l'oscilloscope, schéma de principe sans brochage réel. -->
  <rect x="20" y="50" width="250" height="220" rx="4" /><text x="145" y="40" fill="currentColor" stroke="none" text-anchor="middle" font-weight="600">calculateur</text>
  <rect x="40" y="110" width="70" height="80" rx="3" stroke-width="1.5" /><text x="75" y="155" fill="currentColor" stroke="none" text-anchor="middle" font-size="11">MCU</text>
  <rect x="160" y="110" width="80" height="80" rx="3" stroke-width="1.5" /><text x="200" y="148" fill="currentColor" stroke="none" text-anchor="middle" font-size="11">trans-</text><text x="200" y="162" fill="currentColor" stroke="none" text-anchor="middle" font-size="11">ceiver</text>
  <path d="M110 130 H160 M110 170 H160" stroke-width="1.5" />
  <text x="135" y="124" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">TXD</text><text x="135" y="184" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">RXD</text>
  <path d="M240 130 H340 M240 170 H340" />
  <text x="308" y="124" fill="currentColor" stroke="none" text-anchor="middle" font-size="11">CAN-H</text><text x="308" y="164" fill="currentColor" stroke="none" text-anchor="middle" font-size="11">CAN-L</text>
  <path d="M40 240 H250" stroke-width="1.5" /><text x="145" y="258" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">masse du calculateur</text>
  <circle cx="340" cy="130" r="3" fill="currentColor" stroke="none" /><circle cx="340" cy="170" r="3" fill="currentColor" stroke="none" />
  <rect x="420" y="70" width="160" height="180" rx="4" /><text x="500" y="60" fill="currentColor" stroke="none" text-anchor="middle" font-weight="600">oscilloscope</text>
  <path d="M340 130 H380 V100 H420" stroke-width="1.5" /><text x="440" y="104" fill="currentColor" stroke="none" font-size="11">voie 1</text>
  <path d="M340 170 H390 V140 H420" stroke-width="1.5" stroke-dasharray="6 3" /><text x="440" y="144" fill="currentColor" stroke="none" font-size="11">voie 2</text>
  <path d="M250 240 H400 V200 H420" stroke-width="1.5" /><text x="440" y="204" fill="currentColor" stroke="none" font-size="11">masses des sondes</text>
  <text x="500" y="232" fill="currentColor" stroke="none" text-anchor="middle" font-size="11" font-weight="600">math : 1 − 2</text>
  <text x="300" y="300" fill="currentColor" stroke="none" text-anchor="middle" font-size="11">jamais de masse de sonde sur CAN-H ni sur CAN-L (FE-07)</text>
</svg>
