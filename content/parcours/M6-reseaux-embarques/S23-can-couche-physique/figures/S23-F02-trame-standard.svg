<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 170" width="600" height="170" fill="none" stroke="currentColor" stroke-width="2" font-family="Inter, system-ui, sans-serif" font-size="12">
  <!-- Figure réalisée par AREPROG : champs d'une trame CAN standard, d'après la note TI SLOA101 ; largeurs non proportionnelles. -->
  <rect x="20" y="60" width="560" height="50" />
  <path d="M60 60 V110 M180 60 V110 M215 60 V110 M250 60 V110 M280 60 V110 M330 60 V110 M450 60 V110 M500 60 V110 M540 60 V110" />
  <text x="40" y="90" fill="currentColor" stroke="none" text-anchor="middle" font-size="11">SOF</text>
  <text x="120" y="84" fill="currentColor" stroke="none" text-anchor="middle" font-size="11">identifiant</text><text x="120" y="99" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">11 bits</text>
  <text x="197" y="90" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">RTR</text>
  <text x="232" y="90" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">IDE</text>
  <text x="265" y="90" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">r0</text>
  <text x="305" y="84" fill="currentColor" stroke="none" text-anchor="middle" font-size="11">DLC</text><text x="305" y="99" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">4 bits</text>
  <text x="390" y="84" fill="currentColor" stroke="none" text-anchor="middle" font-size="11">données</text><text x="390" y="99" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">0 à 8 octets</text>
  <text x="475" y="90" fill="currentColor" stroke="none" text-anchor="middle" font-size="11">CRC</text>
  <text x="520" y="90" fill="currentColor" stroke="none" text-anchor="middle" font-size="11">ACK</text>
  <text x="560" y="90" fill="currentColor" stroke="none" text-anchor="middle" font-size="11">EOF</text>
  <path d="M20 40 H250" stroke-width="1" /><path d="M20 35 V45 M250 35 V45" stroke-width="1" />
  <text x="135" y="30" fill="currentColor" stroke="none" text-anchor="middle" font-size="11">arbitrage : identifiant le plus bas prioritaire</text>
  <path d="M500 125 H540" stroke-width="1" /><path d="M500 120 V130 M540 120 V130" stroke-width="1" />
  <text x="520" y="148" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">dominant</text><text x="520" y="162" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">si reçu sans erreur</text>
  <text x="40" y="132" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">1 bit</text><text x="40" y="146" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">dominant</text>
</svg>
