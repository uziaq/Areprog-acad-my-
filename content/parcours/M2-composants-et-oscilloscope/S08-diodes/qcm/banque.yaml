  type: choix_unique
  securite: false
  competences: [D4.3]
  section: "S08-L02#la-zener--utiliser-le-claquage"
  enonce: "Un montage Zener régule à vide. On branche une charge de très faible résistance. Que se passe-t-il ?"
  propositions:
    - {id: a, texte: "La charge prend plus de courant que la résistance n'en fournit : la sortie tombe sous Uz"}
    - {id: b, texte: "La sortie reste à Uz quoi qu'il arrive"}
    - {id: c, texte: "La sortie monte"}
    - {id: d, texte: "La Zener conduit davantage"}
