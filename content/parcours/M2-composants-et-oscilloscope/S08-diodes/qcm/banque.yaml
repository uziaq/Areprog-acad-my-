  securite: false
  competences: [D4.3]
  section: "S08-L02#la-zener--utiliser-le-claquage"
  enonce: "Pourquoi une Zener doit-elle toujours avoir une résistance série ?"
  propositions:
    - {id: a, texte: "C'est la résistance qui fixe le courant ; sans elle, la Zener serait détruite"}
    - {id: b, texte: "Pour augmenter la tension de sortie"}
    - {id: c, texte: "Pour la protéger de l'électricité statique"}
