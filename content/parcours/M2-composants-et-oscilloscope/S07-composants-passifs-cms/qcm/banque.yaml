- id: S07-Q003
  type: choix_unique
  securite: false
  competences: [D4.1]
  section: "S07-L01#le-code-de-taille-dune-puce-passive"
  enonce: "Pourquoi faut-il vérifier si un code de taille est en pouces ou en millimètres ?"
