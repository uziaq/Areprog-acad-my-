  securite: false
  competences: [D4.1]
  section: "S07-L01#le-code-de-taille-dune-puce-passive"
  enonce: "Que représentent les quatre chiffres d'un code de taille comme 0805 en pouces ?"
  propositions:
    - {id: a, texte: "La longueur puis la largeur, en centièmes de pouce"}
    - {id: b, texte: "La valeur de la résistance"}
    - {id: c, texte: "La puissance en milliwatts"}
    - {id: d, texte: "La tension maximale"}
