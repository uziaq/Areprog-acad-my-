  <rect x="330" y="150" width="20" height="40" /><text x="358" y="170" fill="currentColor" stroke="none" font-size="11">capteur</text><text x="358" y="184" fill="currentColor" stroke="none" font-size="11">résistif</text>
  <path d="M340 190 V200" />
  <path d="M40 200 H390" /><text x="14" y="218" fill="currentColor" stroke="none" font-weight="600">masse</text>
</svg>
