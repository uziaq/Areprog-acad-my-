- id: S10-Q016
  type: choix_unique
  securite: false
  competences: [D4.5]
  section: "S10-L02#exemple-6--une-hystérésis-trop-étroite"
  enonce: "Le bruit d'un signal vaut 0,5 V crête à crête, l'hystérésis du comparateur 0,2 V. Que se passe-t-il ?"
  propositions:
    - {id: a, texte: "Des basculements multiples restent possibles : il faut élargir l'hystérésis ou filtrer"}
    - {id: b, texte: "Rien, l'hystérésis suffit toujours"}
    - {id: c, texte: "Le comparateur ne bascule plus jamais"}
    - {id: d, texte: "La sortie devient analogique"}
- id: S10-Q017
  type: choix_unique
  securite: false
  competences: [D4.5]
  section: "S10-L03#ce-que-fait-un-convertisseur-analogique-numérique"
  enonce: "À quoi un convertisseur analogique-numérique compare-t-il la tension qu'il mesure ?"
  propositions:
    - {id: a, texte: "À sa tension de référence"}
    - {id: b, texte: "À la masse seulement"}
    - {id: c, texte: "À la tension batterie"}
    - {id: d, texte: "À rien : il mesure directement"}
- id: S10-Q018
  type: choix_unique
  securite: false
  competences: [D4.5]
  section: "S10-L03#le-rôle-de-la-référence-de-tension"
  enonce: "La référence d'un convertisseur est 1 % trop haute. Quel est l'effet sur les tensions mesurées (mesure non ratiométrique) ?"
  propositions:
    - {id: a, texte: "Elles paraissent environ 1 % trop basses : c'est une erreur de gain"}
    - {id: b, texte: "Elles paraissent 1 % trop hautes"}
    - {id: c, texte: "Aucun effet"}
    - {id: d, texte: "Seules les tensions nulles sont faussées"}
