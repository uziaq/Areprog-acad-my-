- id: S10-Q021
  type: choix_unique
  securite: false
  competences: [D4.5]
  section: "S10-L03#la-mesure-ratiométrique"
  enonce: "Pourquoi un capteur ratiométrique alimenté par la même source que la référence du convertisseur est-il insensible aux variations de cette source ?"
  propositions:
    - {id: a, texte: "Le signal et la référence varient ensemble : leur rapport reste constant"}
    - {id: b, texte: "Le capteur régule sa propre alimentation"}
    - {id: c, texte: "Le convertisseur corrige par logiciel"}
    - {id: d, texte: "Il ne l'est pas"}
