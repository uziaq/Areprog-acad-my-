  type: calcul
  securite: false
  competences: [D4.5]
  section: "S10-L02#calculer-les-seuils"
  enonce: "Comparateur sous 5 V, Rx = Ry = 10 kΩ, Rh = 100 kΩ, sortie de 0 à 5 V. Quel est le seuil bas VL ?"
  unite_attendue: V
