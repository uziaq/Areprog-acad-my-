  type: choix_unique
  securite: false
  competences: [D4.5]
  section: "S10-L03#exemple-8--un-capteur-ratiométrique-sous-une-alimentation-basse"
  enonce: "Sur un capteur ratiométrique, vous lisez 2,4 V de signal sous 4,8 V d'alimentation. Que faites-vous avant de conclure à une dérive du capteur ?"
  propositions:
    - {id: a, texte: "Je calcule le rapport, 0,5, et je cherche pourquoi l'alimentation capteur est basse"}
    - {id: b, texte: "Je remplace le capteur"}
    - {id: c, texte: "Je conclus à une dérive de 0,1 V"}
    - {id: d, texte: "Je mesure le signal sans l'alimentation"}
- id: S10-Q023
  type: choix_unique
  securite: true
  competences: [D4.5, D1.3]
  section: "S10-L01#laop-réel"
  enonce: "Avant de brancher la tension d'entrée sur un AOP alimenté au TP-15, que vérifiez-vous ?"
  propositions:
    - {id: a, texte: "Qu'elle reste entre les alimentations de l'AOP : je règle le potentiomètre avant de brancher"}
    - {id: b, texte: "Rien, l'entrée d'un AOP supporte tout"}
    - {id: c, texte: "Qu'elle dépasse l'alimentation pour voir la saturation"}
    - {id: d, texte: "Qu'elle est négative"}
- id: S10-Q024
  type: choix_unique
  securite: true
  competences: [D4.5, D1.3]
  section: "S10-L03#ce-que-cela-change-pour-le-dépanneur"
  enonce: "Au TP-15, vous devez poser des pointes de touche arrière sur un capteur du véhicule d'atelier. Dans quel état est le véhicule pendant la pose ?"
  propositions:
    - {id: a, texte: "Immobilisé, batterie débranchée ; on ne met le contact qu'après la pose"}
    - {id: b, texte: "Contact mis, pour voir tout de suite la tension"}
    - {id: c, texte: "Moteur tournant, pour avoir un signal vivant"}
    - {id: d, texte: "Peu importe, ce n'est qu'une mesure"}
- id: S10-Q025
  type: choix_unique
  securite: true
  competences: [D4.5, D1.3]
  section: "S10-L01#exemple-2--gain-dun-inverseur"
  enonce: "L'AOP du TP-15 est alimenté en +12 V et −12 V par deux sorties de l'alimentation de labo. Que réglez-vous et notez-vous avant la mise sous tension ?"
  propositions:
    - {id: a, texte: "Une limite de courant par sortie, écrite au journal, et les polarités vérifiées"}
    - {id: b, texte: "Une seule limite, sur la sortie positive"}
    - {id: c, texte: "Aucune limite, l'AOP consomme peu"}
    - {id: d, texte: "La tension au maximum"}
