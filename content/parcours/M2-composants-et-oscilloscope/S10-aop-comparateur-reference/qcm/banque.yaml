# Questions sans les bonnes réponses (voir reponses.yaml).
# Banque de 25 questions (pédagogie v0.3 ; décision E-01 encore ouverte). Valeurs de calcul [EXEMPLE].
- id: S10-Q001
  type: choix_unique
  securite: false
  competences: [D4.5]
  section: "S10-L01#un-amplificateur-de-différence-à-très-grand-gain"
  enonce: "Qu'amplifie un amplificateur opérationnel ?"
  propositions:
    - {id: a, texte: "La différence de tension entre ses deux entrées"}
    - {id: b, texte: "La tension de son entrée + seule"}
    - {id: c, texte: "Le courant de ses entrées"}
    - {id: d, texte: "Sa tension d'alimentation"}
- id: S10-Q002
  type: choix_unique
  securite: false
  competences: [D4.5]
  section: "S10-L01#un-amplificateur-de-différence-à-très-grand-gain"
  enonce: "Dans le modèle idéal d'un AOP, quel courant consomment ses entrées ?"
  propositions:
    - {id: a, texte: "Aucun"}
    - {id: b, texte: "Le courant de sortie divisé par le gain"}
    - {id: c, texte: "Quelques milliampères"}
    - {id: d, texte: "Le courant de la charge"}
- id: S10-Q003
  type: choix_unique
  securite: false
  competences: [D4.5]
  section: "S10-L01#le-comparateur--laop-sans-contre-réaction"
  enonce: "Un AOP sans contre-réaction a son entrée + plus positive que son entrée −. Où est sa sortie ?"
  propositions:
    - {id: a, texte: "Saturée vers l'alimentation positive"}
    - {id: b, texte: "À zéro"}
    - {id: c, texte: "Égale à l'entrée +"}
    - {id: d, texte: "Saturée vers l'alimentation négative"}
- id: S10-Q004
  type: choix_unique
  securite: false
  competences: [D4.5]
  section: "S10-L01#la-contre-réaction--la-sortie-vient-équilibrer-les-entrées"
  enonce: "Sur un schéma, la sortie d'un AOP est reliée directement à son entrée −, le signal arrive sur l'entrée +. Quel est ce montage ?"
  propositions:
    - {id: a, texte: "Un suiveur, de gain 1"}
    - {id: b, texte: "Un inverseur"}
    - {id: c, texte: "Un comparateur"}
    - {id: d, texte: "Un non inverseur de gain 2"}
- id: S10-Q005
  type: calcul
  securite: false
  competences: [D4.5]
  section: "S10-L01#exemple-1--gain-dun-non-inverseur"
  enonce: "Un non inverseur a R2 = 47 kΩ entre sortie et entrée −, R1 = 10 kΩ entre entrée − et masse. L'entrée vaut 0,5 V. Quelle est la sortie ?"
  unite_attendue: V
- id: S10-Q006
  type: calcul
  securite: false
  competences: [D4.5]
  section: "S10-L01#exemple-2--gain-dun-inverseur"
  enonce: "Un inverseur a R1 = 10 kΩ et R2 = 33 kΩ, alimenté en ±12 V. L'entrée vaut 0,5 V. Quelle est la sortie ?"
  unite_attendue: V
- id: S10-Q007
  type: choix_unique
  securite: false
  competences: [D4.5]
  section: "S10-L01#la-contre-réaction--la-sortie-vient-équilibrer-les-entrées"
  enonce: "Pourquoi appelle-t-on l'entrée − d'un inverseur une masse virtuelle ?"
  propositions:
    - {id: a, texte: "La contre-réaction la maintient au potentiel de l'entrée +, reliée à la masse, sans qu'elle y soit branchée"}
    - {id: b, texte: "Elle est reliée directement à la masse"}
    - {id: c, texte: "Elle ne sert à rien"}
    - {id: d, texte: "Elle est toujours à la tension d'alimentation"}
- id: S10-Q008
  type: choix_unique
  securite: false
  competences: [D4.5, D4.6]
  section: "S10-L01#laop-réel"
  enonce: "Que garantit un AOP à sortie rail-to-rail ?"
  propositions:
    - {id: a, texte: "Une sortie qui s'approche beaucoup des tensions d'alimentation, selon la charge"}
    - {id: b, texte: "Une sortie qui dépasse l'alimentation"}
    - {id: c, texte: "Une tension de décalage nulle"}
    - {id: d, texte: "Un gain infini"}
- id: S10-Q009
  type: choix_unique
  securite: false
  competences: [D4.5, D4.6]
  section: "S10-L01#laop-réel"
  enonce: "Qu'est-ce que la tension de décalage (offset) d'un AOP ?"
  propositions:
    - {id: a, texte: "La petite tension à appliquer entre les entrées pour ramener la sortie à zéro"}
    - {id: b, texte: "La tension maximale de sortie"}
    - {id: c, texte: "La tension d'alimentation minimale"}
    - {id: d, texte: "La chute de tension d'une diode d'entrée"}
- id: S10-Q010
  type: choix_unique
  securite: false
  competences: [D4.5]
  section: "S10-L01#exemple-3--une-sortie-qui-sature"
  enonce: "La sortie d'un AOP de calculateur reste collée près de son alimentation. Quelle démarche suivez-vous ?"
  propositions:
    - {id: a, texte: "Mesurer les deux entrées : entrée hors plage, contre-réaction coupée ou AOP défectueux"}
    - {id: b, texte: "Remplacer l'AOP immédiatement"}
    - {id: c, texte: "Conclure que le gain est trop faible"}
    - {id: d, texte: "Débrancher la charge et s'arrêter là"}
- id: S10-Q011
  type: choix_unique
  securite: false
  competences: [D4.5]
  section: "S10-L02#le-problème-du-bruit"
  enonce: "Pourquoi un comparateur sans hystérésis peut-il basculer plusieurs fois près de son seuil ?"
  propositions:
    - {id: a, texte: "Le bruit fait passer le signal plusieurs fois au-dessus et en dessous du seuil"}
    - {id: b, texte: "Son gain est trop faible"}
    - {id: c, texte: "Son alimentation est trop haute"}
    - {id: d, texte: "Le seuil change tout seul"}
- id: S10-Q012
  type: choix_unique
  securite: false
  competences: [D4.5]
  section: "S10-L02#lhystérésis--deux-seuils-au-lieu-dun"
  enonce: "Comment obtient-on l'hystérésis d'un comparateur ?"
  propositions:
    - {id: a, texte: "Par une réaction positive : une résistance entre la sortie et l'entrée +"}
    - {id: b, texte: "Par une contre-réaction sur l'entrée −"}
    - {id: c, texte: "En ajoutant un condensateur sur l'alimentation"}
    - {id: d, texte: "En baissant le gain"}
- id: S10-Q013
  type: choix_unique
  securite: false
  competences: [D4.5]
  section: "S10-L02#lhystérésis--deux-seuils-au-lieu-dun"
  enonce: "Sortie au niveau haut, avec quelle résistance la résistance d'hystérésis Rh se retrouve-t-elle en parallèle ?"
  propositions:
    - {id: a, texte: "Avec Rx, la résistance du pont reliée à l'alimentation"}
    - {id: b, texte: "Avec Ry, la résistance reliée à la masse"}
    - {id: c, texte: "Avec aucune"}
    - {id: d, texte: "Avec la charge"}
