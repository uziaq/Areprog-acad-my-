  type: calcul
  securite: false
  competences: [D4.5]
  section: "S10-L02#exemple-5--calculer-les-seuils-dhystérésis"
  enonce: "Un comparateur a un seuil haut de 3,1 V et un seuil bas de 2,7 V. Quelle est la largeur d'hystérésis ?"
