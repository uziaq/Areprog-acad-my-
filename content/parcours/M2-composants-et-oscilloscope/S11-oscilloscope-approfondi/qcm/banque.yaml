- id: S11-Q012
  type: choix_unique
  securite: true
  competences: [D3.4]
  section: "S11-L02#la-masse-de-la-sonde-est-reliée-à-la-terre"
  enonce: "Un collègue propose de couper la terre du cordon de l'oscilloscope pour faire une mesure. Que répondre ?"
  propositions:
    - {id: a, texte: "Jamais : sans terre, les connecteurs et les sondes peuvent être portés à des tensions dangereuses"}
    - {id: b, texte: "C'est sans danger si l'on fait vite"}
    - {id: c, texte: "C'est la méthode normale pour une mesure flottante"}
    - {id: d, texte: "C'est nécessaire pour compenser la sonde"}
