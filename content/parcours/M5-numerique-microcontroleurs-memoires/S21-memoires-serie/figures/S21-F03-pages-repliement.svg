  <path d="M540 130 Q540 190 300 190 Q80 190 80 136" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#s21f03-fl)" />
  <text x="300" y="210" fill="currentColor" stroke="none" text-anchor="middle" font-size="11">au-delà de la fin : retour au début de la même page, octets écrasés (hachurés)</text>
