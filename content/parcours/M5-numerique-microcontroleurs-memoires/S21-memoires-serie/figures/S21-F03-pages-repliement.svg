  <text x="540" y="82" fill="currentColor" stroke="none" text-anchor="end" font-size="10">fin de page</text>
  <text x="320" y="78" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">adresse de départ</text>
  <path d="M320 82 V88" stroke-width="1.5" />
