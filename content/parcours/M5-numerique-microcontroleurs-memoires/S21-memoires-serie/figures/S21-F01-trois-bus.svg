<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" fill="none" stroke="currentColor" stroke-width="2" font-family="Inter, system-ui, sans-serif" font-size="12">
  <!-- Figure réalisée par AREPROG : signaux de trois familles de mémoires série, schéma de principe sans brochage réel. -->
  <rect x="60" y="60" width="110" height="140" rx="4" />
  <text x="115" y="40" fill="currentColor" stroke="none" text-anchor="middle" font-weight="600">EEPROM I²C</text>
  <rect x="270" y="60" width="110" height="140" rx="4" />
  <text x="325" y="40" fill="currentColor" stroke="none" text-anchor="middle" font-weight="600">EEPROM Microwire</text>
  <rect x="480" y="60" width="110" height="140" rx="4" />
  <text x="535" y="40" fill="currentColor" stroke="none" text-anchor="middle" font-weight="600">Flash SPI</text>
  <g font-size="11">
    <path d="M30 80 H60 M30 110 H60 M30 140 H60 M30 170 H60" />
    <text x="66" y="84" fill="currentColor" stroke="none">SDA</text><text x="66" y="114" fill="currentColor" stroke="none">SCL</text><text x="66" y="144" fill="currentColor" stroke="none">A0 à A2</text><text x="66" y="174" fill="currentColor" stroke="none">WP</text>
    <path d="M170 80 H200 M170 180 H200" />
    <text x="164" y="84" fill="currentColor" stroke="none" text-anchor="end">VCC</text><text x="164" y="184" fill="currentColor" stroke="none" text-anchor="end">GND</text>
    <path d="M240 80 H270 M240 110 H270 M240 140 H270 M240 170 H270" />
    <text x="276" y="84" fill="currentColor" stroke="none">CS</text><text x="276" y="114" fill="currentColor" stroke="none">SK</text><text x="276" y="144" fill="currentColor" stroke="none">DI</text><text x="276" y="174" fill="currentColor" stroke="none">DO</text>
    <path d="M380 80 H410 M380 130 H410 M380 180 H410" />
    <text x="374" y="84" fill="currentColor" stroke="none" text-anchor="end">VCC</text><text x="374" y="134" fill="currentColor" stroke="none" text-anchor="end">ORG</text><text x="374" y="184" fill="currentColor" stroke="none" text-anchor="end">GND</text>
    <path d="M450 75 H480 M450 100 H480 M450 125 H480 M450 150 H480 M450 175 H480" />
    <text x="486" y="79" fill="currentColor" stroke="none">/CS</text><text x="486" y="104" fill="currentColor" stroke="none">CLK</text><text x="486" y="129" fill="currentColor" stroke="none">DI</text><text x="486" y="154" fill="currentColor" stroke="none">DO</text><text x="486" y="179" fill="currentColor" stroke="none">/WP</text>
    <path d="M590 80 H620 M590 130 H620 M590 180 H620" />
    <text x="584" y="84" fill="currentColor" stroke="none" text-anchor="end">VCC</text><text x="584" y="134" fill="currentColor" stroke="none" text-anchor="end">/HOLD</text><text x="584" y="184" fill="currentColor" stroke="none" text-anchor="end">GND</text>
  </g>
  <text x="115" y="230" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">2 fils + adresse</text>
  <text x="325" y="230" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">4 fils, organisation x8 / x16</text>
  <text x="535" y="230" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">4 fils, pages et secteurs</text>
