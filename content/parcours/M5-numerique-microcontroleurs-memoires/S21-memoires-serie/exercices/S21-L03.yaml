- id: S21-L03-EX01
  version: "0.1"
  type: choix_unique
  enonce: "Sur l'EEPROM I²C étudiée, la broche WP est en l'air. La mémoire est-elle protégée en écriture ?"
  propositions:
    - {id: a, texte: "Non : seule WP tenue haute protège ; en l'air ou à la masse, elle ne protège pas"}
    - {id: b, texte: "Oui, toujours"}
    - {id: c, texte: "Oui, mais seulement la moitié de la mémoire"}
    - {id: d, texte: "La lecture est alors impossible"}
  competences: [D7.3]
  objectif: O1
- id: S21-L03-EX02
  version: "0.1"
  type: choix_unique
  enonce: "Quelle situation présente le plus grand risque de corrompre une mémoire ?"
  propositions:
    - {id: a, texte: "Une coupure d'alimentation pendant une écriture en circuit"}
    - {id: b, texte: "Une lecture hors circuit à la bonne tension"}
    - {id: c, texte: "Le calcul de l'empreinte d'une sauvegarde"}
    - {id: d, texte: "Une photo du marquage"}
  competences: [D7.3, D9.1]
  objectif: O2
