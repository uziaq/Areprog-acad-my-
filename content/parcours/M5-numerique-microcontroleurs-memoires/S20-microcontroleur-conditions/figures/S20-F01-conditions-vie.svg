<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" fill="none" stroke="currentColor" stroke-width="2" font-family="Inter, system-ui, sans-serif" font-size="12">
  <!-- Figure réalisée par AREPROG : quatre conditions de vie d'un microcontrôleur, schéma de principe sans brochage réel. -->
  <rect x="200" y="110" width="200" height="140" rx="6" />
  <text x="300" y="132" fill="currentColor" stroke="none" text-anchor="middle" font-weight="600">microcontrôleur</text>
  <rect x="215" y="145" width="80" height="40" stroke-width="1.5" />
  <text x="255" y="169" fill="currentColor" stroke="none" text-anchor="middle" font-size="11">processeur</text>
  <rect x="305" y="145" width="80" height="40" stroke-width="1.5" />
  <text x="345" y="163" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">mémoire</text>
  <text x="345" y="177" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">programme</text>
  <rect x="215" y="195" width="80" height="40" stroke-width="1.5" />
  <text x="255" y="219" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">mémoire vive</text>
  <rect x="305" y="195" width="80" height="40" stroke-width="1.5" />
  <text x="345" y="219" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">périphériques</text>
  <rect x="20" y="20" width="170" height="70" rx="4" />
  <text x="105" y="42" fill="currentColor" stroke="none" text-anchor="middle" font-weight="600">1 alimentations</text>
  <text x="105" y="60" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">numérique, analogique</text>
  <text x="105" y="74" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">découplage par paire</text>
  <rect x="410" y="20" width="170" height="70" rx="4" />
  <text x="495" y="42" fill="currentColor" stroke="none" text-anchor="middle" font-weight="600">2 horloge</text>
  <text x="495" y="60" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">quartz ou résonateur</text>
  <text x="495" y="74" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">condensateurs de charge</text>
  <rect x="410" y="270" width="170" height="70" rx="4" />
  <text x="495" y="292" fill="currentColor" stroke="none" text-anchor="middle" font-weight="600">3 reset</text>
  <text x="495" y="310" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">tirage, condensateur</text>
  <text x="495" y="324" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">superviseur, watchdog</text>
  <rect x="20" y="270" width="170" height="70" rx="4" />
  <text x="105" y="292" fill="currentColor" stroke="none" text-anchor="middle" font-weight="600">4 mode de démarrage</text>
  <text x="105" y="310" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">broches ou réglages</text>
  <text x="105" y="324" fill="currentColor" stroke="none" text-anchor="middle" font-size="10">de configuration</text>
  <path d="M190 70 L215 110 M410 70 L385 110 M410 290 L385 250 M190 290 L215 250" />
</svg>
