# Chargé par l'application uniquement après la soumission du QCM.
- id: S20-Q001
  bonnes: [a]
  explication: "C'est ce qui le distingue d'un microprocesseur seul."
  pourquoi_faux:
    b: "Il faut aussi les mémoires et les périphériques."
    c: "Ce sont des composants externes."
    d: "Une mémoire seule ne calcule pas."
  source: "S20-L01#architecture-générique"
- id: S20-Q002
