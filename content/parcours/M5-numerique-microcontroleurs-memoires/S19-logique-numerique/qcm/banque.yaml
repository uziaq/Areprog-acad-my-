  propositions:
    - {id: a, texte: "Une résistance de tirage vers l'alimentation"}
    - {id: b, texte: "Rien, la sortie fournit le niveau haut"}
    - {id: c, texte: "Un condensateur vers la masse"}
    - {id: d, texte: "Une résistance vers la masse"}
- id: S19-Q015
  type: choix_unique
  securite: false
  competences: [D7.1]
  section: "S19-L02#les-types-de-sortie"
  enonce: "Pourquoi plusieurs sorties trois états peuvent-elles partager une ligne ?"
  propositions:
    - {id: a, texte: "Parce qu'une sortie non validée est en haute impédance ; une seule est active à la fois"}
    - {id: b, texte: "Parce qu'elles fournissent toutes le même niveau"}
    - {id: c, texte: "Parce qu'elles sont à drain ouvert"}
    - {id: d, texte: "Parce qu'elles n'ont pas d'alimentation"}
- id: S19-Q016
  type: choix_unique
  securite: false
  competences: [D7.1]
  section: "S19-L02#les-types-de-sortie"
  enonce: "Peut-on changer le niveau d'une sortie CMOS push-pull 3,3 V en ajoutant une résistance de tirage vers 5 V ?"
  propositions:
    - {id: a, texte: "Non : le tirage ne sert à changer de niveau que sur une sortie à drain ou collecteur ouvert"}
    - {id: b, texte: "Oui, toujours"}
    - {id: c, texte: "Oui, avec une résistance de faible valeur"}
    - {id: d, texte: "Oui, si on ajoute un condensateur"}
- id: S19-Q017
  type: choix_unique
  securite: false
  competences: [D7.1]
  section: "S19-L02#compatibilité-33-v--5-v"
  enonce: "Une sortie 3,3 V garantit VOH = 2,4 V ; elle commande une entrée CMOS 5 V qui exige VIH = 3,5 V. Conclusion ?"
  propositions:
    - {id: a, texte: "Le niveau haut n'est pas garanti : il faut un translateur de niveau ou un récepteur adapté"}
    - {id: b, texte: "Compatible, car 2,4 V est plus de la moitié de 3,3 V"}
    - {id: c, texte: "Compatible, car la masse est commune"}
    - {id: d, texte: "Compatible si le câble est court"}
