# Chargé par l'application uniquement après la soumission du QCM.
- id: S19-Q001
  bonnes: [a]
  explication: "8 + 2 + 1 = 11."
  pourquoi_faux:
    b: "C'est l'écriture binaire, lue à tort en décimal."
    c: "13 s'écrit 1101."
    d: "7 s'écrit 0111."
  source: "S19-L01#binaire-hexadécimal-décimal"
- id: S19-Q002
  bonnes: [a]
  explication: "Seize valeurs, de 0 à F, soit quatre bits."
  pourquoi_faux:
    b: "Huit bits font un octet, soit deux chiffres hexadécimaux."
    c: "Deux bits ne donnent que quatre valeurs."
    d: "Seize est le nombre de valeurs, pas de bits."
  source: "S19-L01#binaire-hexadécimal-décimal"
- id: S19-Q003
  bonnes: [a]
  explication: "3 × 16 + 12 = 60."
  pourquoi_faux:
    b: "3 et 12 accolés, sans les puissances de 16."
    c: "C n'est pas 6."
    d: "Le chiffre C (12) a été oublié."
  source: "S19-L01#exemple-1--de-lhexadécimal-au-décimal"
- id: S19-Q004
  bonnes: [a]
  explication: "200 = 1100 1000 en binaire, soit C et 8."
  pourquoi_faux:
    b: "Écriture décimale recopiée."
    c: "Les deux chiffres sont inversés."
    d: "1100 0000 vaut 192."
  source: "S19-L01#exemple-2--du-décimal-au-binaire"
- id: S19-Q005
  bonnes: [a]
  explication: "Le ET ne donne 1 que si toutes ses entrées sont à 1."
  pourquoi_faux:
    b: "Ce serait un OU."
    c: "Les deux entrées ont un niveau défini."
    d: "Une porte n'a pas d'horloge."
  source: "S19-L01#les-portes-logiques"
- id: S19-Q006
  bonnes: [a]
  explication: "C'est la définition du OU exclusif."
  pourquoi_faux:
    b: "Le OU donne aussi 1 pour 1 et 1."
    c: "Le NON-ET donne aussi 1 pour 0 et 0."
    d: "Le NON-OU ne donne 1 que pour 0 et 0."
  source: "S19-L01#les-portes-logiques"
- id: S19-Q007
  bonnes: [a]
  explication: "Le ET vaut 1 seulement pour 1 et 1, l'inversion donne alors 0."
  pourquoi_faux:
    b: "Elle donne 1."
    c: "Elle donne 1."
    d: "La combinaison 1, 1 donne 0."
  source: "S19-L01#exemple-3--une-table-de-vérité"
- id: S19-Q008
  bonnes: [a]
  explication: "La bascule D mémorise D au front actif."
  pourquoi_faux:
    b: "C'est le fonctionnement d'une autre bascule montée en diviseur."
    c: "Elle n'agit qu'au front."
    d: "C'est une remise à 0."
  source: "S19-L01#bascules-et-registres"
- id: S19-Q009
  bonnes: [a]
  explication: "À chaque front, les bits avancent d'une place."
  pourquoi_faux:
    b: "Sans rapport."
    c: "Sans rapport."
    d: "C'est un circuit numérique."
  source: "S19-L01#bascules-et-registres"
- id: S19-Q010
  bonnes: [a]
  explication: "I pour entrée, H pour haut : ce que l'entrée exige pour lire un 1."
  pourquoi_faux:
    b: "C'est VOH."
    c: "C'est VIL."
    d: "Sans rapport direct."
  source: "S19-L02#niveaux-logiques-et-marge-de-bruit"
